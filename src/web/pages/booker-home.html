<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (!sessionStorage.getItem("token")) {
    window.location.replace("/auth");
  }
</script>
<title>Tour Manager - Booker Home</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/home.css">
<link rel="stylesheet" href="/static/css/booker-home.css">
</head>
<body>

  <div class="container">

    <div class="brand">Tour Manager</div>

    <!-- These four radio buttons track which tab is active.
         They must come before .tabs and .panels for the CSS
         rules in booker-home.css to be able to "see" them. -->
    <input type="radio" name="tab" id="tab-all-tours" class="tab-input" checked>
    <input type="radio" name="tab" id="tab-my-tours" class="tab-input">
    <input type="radio" name="tab" id="tab-my-account" class="tab-input">
    <input type="radio" name="tab" id="tab-support" class="tab-input">

    <div class="tabs">
      <label for="tab-all-tours" class="tab">All tours</label>
      <label for="tab-my-tours" class="tab">My tours</label>
      <label for="tab-my-account" class="tab">My account</label>
      <label for="tab-support" class="tab">Support</label>
    </div>

    <div class="panels">

      <!-- ============== ALL TOURS ============== -->
      <div class="panel" id="all-tours-panel"></div>

      <!-- ============== MY TOURS ============== -->
      <div class="panel" id="my-tours-panel"></div>

      <!-- ============== MY ACCOUNT ============== -->
      <div class="panel" id="account-panel">

        <div class="section-title">Your information</div>

        <form id="account-form">
          <div class="field">
            <label for="account-username">Username</label>
            <input type="text" id="account-username" disabled name="username">
          </div>

          <div class="field">
            <label for="account-email">Email</label>
            <input type="email" id="account-email" name="email">
          </div>

          <div class="field">
            <label for="account-number">Phone number</label>
            <input type="tel" id="account-number" name="number">
          </div>

          <div class="account-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>

        <div class="logout-row">
          <button type="button" class="btn btn-outline-neutral" onclick="logout()">Log out</button>
        </div>

        <!-- Optional transaction history: every booking the user
             has ever made, whatever its final status was. -->
        <div class="history-wrapper">
          <div class="section-title">Booking history</div>
          <table class="history-table">
            <thead>
              <tr>
                <th>Tour</th>
                <th>Date</th>
                <th>People</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="historyTable"></tbody>
          </table>
        </div>

      </div>

      <!-- ============== SUPPORT ============== -->
      <div class="panel" id="support-panel">
        <div class="section-title">Support</div>
        <button type="button" class="btn btn-primary" id="new-thread-btn">New thread</button>
        <div class="threads-list-wrapper" id="threads-list"></div>
      </div>

    </div>
  </div>

  <!-- Booking modal - hidden by default, one instance reused for whichever tour is clicked -->
  <div class="modal-overlay" id="booking-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Book tour</div>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="modal-username">Booking as</label>
          <input type="text" id="modal-username" disabled>
        </div>

        <div class="field">
          <label for="modal-num-people">Number of people</label>
          <input type="number" id="modal-num-people" min="1" value="1">
        </div>

        <div class="modal-total">
          Total: <span id="modal-total-price">$0.00</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-neutral" id="modal-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-primary" id="modal-submit-btn">Submit booking</button>
      </div>
    </div>
  </div>

  <!-- New support thread modal -->
  <div class="modal-overlay" id="new-thread-modal-overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div class="modal-title">Start a new support thread</div>
      </div>

      <div class="modal-body">
        <div class="field">
          <label for="new-thread-tour">Related tour (optional)</label>
          <select id="new-thread-tour">
            <option value="">No specific tour</option>
          </select>
        </div>

        <div class="field">
          <label for="new-thread-manager">Assign to a manager (optional)</label>
          <select id="new-thread-manager">
            <option value="">No preference</option>
          </select>
        </div>

        <div class="field">
          <label for="new-thread-message">Message</label>
          <textarea id="new-thread-message" placeholder="Describe your issue..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-neutral" id="new-thread-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-primary" id="new-thread-submit-btn">Start thread</button>
      </div>
    </div>
  </div>

  <!-- View/reply modal for one of the booker's own threads -->
  <div class="modal-overlay" id="thread-view-modal-overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div class="modal-title" id="thread-view-title">Support thread</div>
      </div>

      <div class="modal-body">
        <div class="thread-messages" id="thread-view-messages"></div>

        <div class="field" id="thread-view-reply-field">
          <label for="thread-view-reply-text">Reply</label>
          <textarea id="thread-view-reply-text" placeholder="Type a reply..."></textarea>
        </div>

        <p class="field-hint" id="thread-closed-note" hidden>
          This thread is closed. You can no longer send messages.
        </p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-neutral" id="thread-view-done-btn">Done</button>
        <button type="button" class="btn btn-primary" id="thread-view-reply-btn">Send reply</button>
      </div>
    </div>
  </div>

<script src="/static/js/booker-home.js"></script>
</body>
</html>
